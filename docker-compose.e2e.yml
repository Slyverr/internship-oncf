services:
  postgres-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommand_e2e
    ports:
      - "${ECOMMAND_E2E_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommand_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30
    restart: "no"

  seaweedfs-e2e:
    image: docker.io/chrislusf/seaweedfs:4.48
    environment:
      AWS_ACCESS_KEY_ID: ecommandtest
      AWS_SECRET_ACCESS_KEY: ecommand-test-secret
      S3_BUCKET: ecommand-e2e
    ports:
      - "${ECOMMAND_E2E_OBJECT_STORAGE_PORT:-58333}:8333"
    volumes:
      - seaweedfs_e2e_data:/data
    command: ["mini", "-dir=/data"]
    restart: "no"

volumes:
  seaweedfs_e2e_data:
