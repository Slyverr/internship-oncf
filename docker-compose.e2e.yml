services:
  postgres-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommand_e2e
    ports:
      - "${ECOMMAND_E2E_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommand_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30
    restart: "no"

  minio-e2e:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${ECOMMAND_E2E_MINIO_PORT:-59000}:9000"
    volumes:
      - minio_e2e_data:/data
    command: server /data --console-address ":9001"
    restart: "no"

volumes:
  minio_e2e_data:
