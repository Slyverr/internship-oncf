services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommand-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommand}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommand}"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.48
    container_name: ecommand-seaweedfs
    ports:
      - "${OBJECT_STORAGE_API_PORT:-8333}:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:-ecommandlocal}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:-ecommand-local-secret}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET:-ecommand}
    volumes:
      - seaweedfs_data:/data
    command: ["mini", "-dir=/data"]
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_data:
