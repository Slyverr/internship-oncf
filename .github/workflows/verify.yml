name: Verify

on:
  push:
    branches:
      - develop
      - master
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - develop
      - master
    paths-ignore:
      - "**/*.md"

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Workspace verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Verify workspace
        run: bun run verify

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Run browser workflows
        run: bun run test:e2e:browser
