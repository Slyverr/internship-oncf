name: Verify

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Workspace and API workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js for Jest E2E
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run formatting, typechecks, tests, and production builds
        run: bun run verify

      - name: Install Chromium for browser workflow tests
        run: bun run --filter ecommand-web playwright install --with-deps chromium

      - name: Run isolated API and browser workflow tests
        run: bun run test:e2e:browser
